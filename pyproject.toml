[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-harness"
version = "0.1.0"
description = "Turn a week's reading into one reviewed, source-linked document."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "azure-identity>=1.20,<2",
  "openai>=1.80,<4",
  "textual>=1.0,<9",
  "python-docx>=1.1,<2",
  "reportlab>=4.0,<5",
  "pypdf>=5.0,<7",
]

[project.scripts]
doc-harness = "doc_harness.__main__:main"

[tool.setuptools.packages.find]
include = ["doc_harness*"]

[tool.setuptools.package-data]
doc_harness = ["skills/*/SKILL.md"]
